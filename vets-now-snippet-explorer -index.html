let q='',f='all',s='ev';
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(t,q){
  if(!q)return esc(t);
  return esc(t).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<em>$1</em>');
}
function go(){
  let d=D;
  if(f!=='all')d=d.filter(p=>p.type===f);
  if(q){const ql=q.toLowerCase();d=d.filter(p=>p.url.toLowerCase().includes(ql));}
  if(s==='snips')d=[...d].sort((a,b)=>b.snippets.length-a.snippets.length);
  else if(s==='az')d=[...d].sort((a,b)=>a.url.localeCompare(b.url));
  document.getElementById('rc').textContent=d.length.toLocaleString();
  const el=document.getElementById('res');
  if(!d.length){el.innerHTML='<div class="empty">No results.</div>';return;}
  el.innerHTML=d.map(p=>`
    <div class="page">
      <div class="page-head">
        <div class="page-url">${hl(p.url,q)}</div>
        <div class="pmeta">
          <span class="badge ${p.type==='clinic'?'bc':'ba'}">${p.type}</span>
          <span class="pev"><strong>${p.events.toLocaleString()}</strong> ev</span>
          <span class="pev">${p.snippets.length} snips</span>
        </div>
      </div>
      <table class="snip-table">
        <thead><tr><td class="col-s">snippet start</td><td class="col-e">snippet end</td><td class="col-ev">events</td><td class="col-us">users</td></tr></thead>
        <tbody>${p.snippets.map(r=>`<tr><td>${hl(r.s,q)}</td><td>${hl(r.e,q)}</td><td><strong>${r.ev}</strong></td><td>${r.us}</td></tr>`).join('')}</tbody>
      </table>
    </div>`).join('');
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();go();});
document.querySelectorAll('.f').forEach(b=>b.addEventListener('click',()=>{
  f=b.dataset.f;
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');go();
}));
document.getElementById('srt').addEventListener('change',e=>{s=e.target.value;go();});
go();
